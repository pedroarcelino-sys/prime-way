<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="PrimeWay School — plataforma acadêmica para alunos, professores, responsáveis e escola."
    >

    <title>PrimeWay School</title>


    <!-- ==================================================
                        CSS
    =================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- ==================================================
                    GOOGLE FONTS - CINZEL
    =================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>


    <main
        class="hero"
        aria-labelledby="heroTitle"
    >


        <!-- ==================================================
                        APRESENTAÇÃO
        =================================================== -->

        <section class="hero-texto">


            <img
                src="img/logo.png"
                class="logo"
                alt="PrimeWay School"
            >


            <h1 id="heroTitle">
                PrimeWay School
            </h1>


            <h2>
                O caminho certo para o seu futuro começa aqui.
            </h2>


            <p>
                Uma plataforma acadêmica desenvolvida para aproximar
                alunos, professores, responsáveis e escola através
                da tecnologia.
            </p>


            <a
                href="pages/login.html"
                class="btn-principal"
            >
                Entrar
            </a>


        </section>


        <!-- ==================================================
                        ILUSTRAÇÃO
        =================================================== -->

        <section
            class="hero-imagem"
            aria-label="Apresentação visual da PrimeWay School"
        >

            <img
                src="img/estudantes.png"
                alt="Estudantes representando a comunidade escolar da PrimeWay School"
            >

        </section>


    </main>


</body>

</html>
