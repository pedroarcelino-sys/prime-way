name: Qualidade

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validar metadados
        run: composer validate --strict

      - name: Validar PHP e regras do projeto
        run: composer check

      - name: Validar JavaScript
        shell: bash
        run: |
          for arquivo in js/*.js; do
            node --check "$arquivo"
          done
