<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Chat | Secretaria | PrimeWay School</title>

<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/secretaria_shared.css?v=20260928-1">
<link rel="stylesheet" href="../css/secretaria_chat.css?v=20260929-1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap"
rel="stylesheet"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

</head>

<body>

<div class="app-layout">

<aside
class="sidebar"
aria-label="Menu da Secretaria"
></aside>

<main class="secretary-page">

<header class="secretary-header">

<div>
<span class="section-label">
Secretaria • Comunicação
</span>

<h1>Chat</h1>

<p>
Converse diretamente com professores, responsáveis e alunos.
</p>
</div>

<div class="secretary-chat-header-actions">

<button
type="button"
class="secretary-chat-primary"
id="newConversationButton"
>
<i class="fa-solid fa-plus"></i>
Nova conversa
</button>

</div>

</header>

<section class="secretary-chat">

<aside class="secretary-chat-sidebar">

<div class="secretary-chat-search">

<i
class="fa-solid fa-magnifying-glass"
aria-hidden="true"
></i>

<input
type="search"
id="conversationSearch"
placeholder="Buscar conversa..."
autocomplete="off"
aria-label="Buscar conversa"
>

</div>

<div
class="secretary-conversation-list"
id="conversationList"
>

<div class="secretary-chat-empty">
Carregando conversas...
</div>

</div>

</aside>

<section class="secretary-chat-conversation">

<header class="secretary-chat-conversation-header">

<div>
<span class="section-label">
Conversa
</span>

<h2 id="conversationTitle">
Selecione uma conversa
</h2>

<p id="conversationRole">
As mensagens aparecerão aqui.
</p>
</div>

</header>

<div
class="secretary-message-list"
id="messageList"
>

<div class="secretary-chat-empty">
<i class="fa-regular fa-comments"></i>
Selecione uma conversa para começar.
</div>

</div>

<form
class="secretary-message-form"
id="messageForm"
>

<textarea
id="messageInput"
maxlength="5000"
placeholder="Digite sua mensagem..."
disabled
></textarea>

<button
type="submit"
class="secretary-chat-primary"
id="sendMessageButton"
disabled
>
<i class="fa-solid fa-paper-plane"></i>
Enviar
</button>

</form>

</section>

</section>

</main>

</div>

<dialog
class="secretary-contacts-dialog"
id="contactDialog"
>

<div class="secretary-contacts-heading">

<div>
<span class="section-label">
Contatos
</span>

<h2>Nova conversa</h2>
</div>

<button
type="button"
class="secretary-contact-close"
id="closeContactDialog"
aria-label="Fechar"
>
<i class="fa-solid fa-xmark"></i>
</button>

</div>

<div class="secretary-contact-filter-bar">

<input
type="search"
id="contactSearch"
placeholder="Buscar contato..."
autocomplete="off"
>

<select id="contactRoleFilter">
<option value="">Todos os perfis</option>
<option value="professor">Professores</option>
<option value="responsavel">Responsáveis</option>
<option value="aluno">Alunos</option>
</select>

</div>

<div
class="secretary-contact-list"
id="contactList"
>

<div class="secretary-chat-empty">
Carregando contatos...
</div>

</div>

</dialog>

<script src="../js/core.js?v=20260915-4"></script>
<script src="../js/secretaria_common.js?v=20260929-6"></script>
<script src="../js/secretaria_chat.js?v=20260929-1"></script>

</body>
</html>
