<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>Notificações | Secretaria | PrimeWay School</title>

<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/secretaria_shared.css?v=20260928-1">
<link rel="stylesheet" href="../css/secretaria_notificacoes.css?v=20260929-1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap"
rel="stylesheet"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

</head>

<body>

<div class="app-layout">

<aside
class="sidebar"
aria-label="Menu da Secretaria"
></aside>

<main class="secretary-page">

<header class="secretary-header">

<div>

<span class="section-label">
Secretaria • Comunicação
</span>

<h1>Notificações</h1>

<p>
Receba avisos da escola e publique comunicados para alunos,
responsáveis e professores.
</p>

</div>

<div class="secretary-notification-actions">

<button
type="button"
class="secretary-secondary-button"
id="markAllReadButton"
>
<i class="fa-solid fa-check-double"></i>
Marcar todas como lidas
</button>

<button
type="button"
class="secretary-primary-button"
id="newNoticeButton"
>
<i class="fa-solid fa-plus"></i>
Novo comunicado
</button>

</div>

</header>

<section class="secretary-summary">

<article class="secretary-summary-card">
<div class="secretary-summary-icon">
<i class="fa-solid fa-inbox"></i>
</div>
<div>
<span>Recebidas</span>
<strong id="receivedCount">0</strong>
</div>
</article>

<article class="secretary-summary-card">
<div class="secretary-summary-icon warning">
<i class="fa-solid fa-envelope"></i>
</div>
<div>
<span>Não lidas</span>
<strong id="unreadCount">0</strong>
</div>
</article>

<article class="secretary-summary-card">
<div class="secretary-summary-icon success">
<i class="fa-solid fa-paper-plane"></i>
</div>
<div>
<span>Publicadas</span>
<strong id="sentCount">0</strong>
</div>
</article>

<article class="secretary-summary-card">
<div class="secretary-summary-icon">
<i class="fa-solid fa-users-rectangle"></i>
</div>
<div>
<span>Turmas disponíveis</span>
<strong id="classesCount">0</strong>
</div>
</article>

</section>

<section class="secretary-panel">

<div class="secretary-notification-tabs">

<button
type="button"
class="secretary-notification-tab active"
data-notification-tab="inbox"
>
<i class="fa-solid fa-inbox"></i>
Caixa de entrada
</button>

<button
type="button"
class="secretary-notification-tab"
data-notification-tab="sent"
>
<i class="fa-solid fa-paper-plane"></i>
Comunicados enviados
</button>

</div>

<div
class="secretary-notification-view"
id="inboxView"
>

<div class="secretary-notification-toolbar">

<input
type="search"
id="inboxSearch"
placeholder="Buscar notificação recebida..."
autocomplete="off"
>

<select id="inboxReadFilter">
<option value="">Todas</option>
<option value="unread">Não lidas</option>
<option value="read">Lidas</option>
</select>

</div>

<div
class="secretary-notification-list"
id="inboxList"
></div>

</div>

<div
class="secretary-notification-view"
id="sentView"
hidden
>

<div class="secretary-notification-toolbar">

<input
type="search"
id="sentSearch"
placeholder="Buscar comunicado publicado..."
autocomplete="off"
>

</div>

<div
class="secretary-notification-list"
id="sentList"
></div>

</div>

</section>

</main>

</div>

<dialog
id="noticeDialog"
class="secretary-notification-dialog"
>

<form id="noticeForm">

<div class="secretary-notification-dialog-heading">

<div>

<span class="section-label">
Secretaria
</span>

<h2>Novo comunicado</h2>

<p>
Escolha quem receberá a mensagem.
</p>

</div>

<button
type="button"
class="secretary-notification-close"
id="closeNoticeDialog"
aria-label="Fechar"
>
<i class="fa-solid fa-xmark"></i>
</button>

</div>

<div class="secretary-notification-form-grid">

<label>
Público

<select
id="noticeAudience"
required
>
<option value="">Selecione</option>
<option value="all">Todos os usuários ativos</option>
<option value="students">Todos os alunos</option>
<option value="guardians">Todos os responsáveis</option>
<option value="professors">Todos os professores</option>
<option value="class_students">Alunos de uma turma</option>
<option value="class_guardians">Responsáveis de uma turma</option>
<option value="class_both">Alunos e responsáveis de uma turma</option>
</select>
</label>

<label
id="noticeClassGroup"
hidden
>
Turma

<select id="noticeClass">
<option value="">Selecione uma turma</option>
</select>
</label>

<label>
Tipo

<select
id="noticeType"
required
>
<option value="Comunicado">Comunicado</option>
<option value="Aviso">Aviso</option>
<option value="Evento">Evento</option>
<option value="Reunião">Reunião</option>
<option value="Urgente">Urgente</option>
</select>
</label>

<label>
Título

<input
type="text"
id="noticeTitle"
maxlength="190"
required
autocomplete="off"
placeholder="Ex: Reunião de responsáveis"
>
</label>

<label>
Mensagem

<textarea
id="noticeMessage"
maxlength="10000"
required
placeholder="Digite a mensagem..."
></textarea>
</label>

</div>

<div class="secretary-notification-dialog-actions">

<button
type="button"
class="secretary-secondary-button"
id="cancelNoticeButton"
>
Cancelar
</button>

<button
type="submit"
class="secretary-primary-button"
id="publishNoticeButton"
>
Publicar comunicado
</button>

</div>

</form>

</dialog>

<script src="../js/core.js?v=20260915-4"></script>
<script src="../js/secretaria_common.js?v=20260929-4"></script>
<script src="../js/secretaria_notificacoes.js?v=20260929-1"></script>

</body>
</html>
