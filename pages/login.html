<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | PrimeWay School</title>


    <!-- CSS -->

    <link rel="stylesheet" href="../css/login.css">


    <!-- Fonte Cinzel -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>

    <main class="container">


        <!-- =================================
                LADO ESQUERDO
        ================================== -->

        <section class="lado-esquerdo">

            <img
                src="../img/logo.png"
                class="logo"
                alt="PrimeWay School"
            >

            <h1>PrimeWay School</h1>

            <p>

                Bem-vindo! <br>

                Faça login para acessar o sistema acadêmico.

            </p>

        </section>



        <!-- =================================
                LADO DIREITO
        ================================== -->

        <section class="lado-direito">


            <form id="loginForm">

                <h2>Entrar</h2>


                <!-- EMAIL -->

                <div class="campo">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu email"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- SENHA -->

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>


                    <div class="senha">

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            id="mostrarSenha"
                            aria-label="Mostrar senha"
                        >

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>



                <!-- ESQUECI A SENHA -->

                <a
                    href="#"
                    class="esqueci"
                    id="esqueciSenha"
                >
                    Esqueci minha senha
                </a>



                <!-- LOGIN -->

                <button
                    type="submit"
                    class="btn-login"
                >

                    Entrar

                </button>

            </form>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="../js/login.js"></script>

</body>

</html>
